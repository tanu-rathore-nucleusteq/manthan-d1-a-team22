# Serves the built app and forwards /api/ to FastAPI, so the browser sees a single origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Return photos are uploaded through the proxy.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths load index.html and the client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
