# Alembic migrations for the ReturnRight API.
# From src/api:      alembic upgrade head
# From the repo root: alembic -c src/api/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (core/config.py), never from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Split paths on the OS separator, so folders with spaces or drive letters work on Windows.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
