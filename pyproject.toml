# Backend tooling for the whole repository: formatter, linter and tests.
# Dependencies live in each service's requirements.txt (one Docker image per service).

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src/api", "src/gateway"]

[tool.ruff.lint]
# E/F errors, I imports, B bugbear, UP upgrades, N naming, S security (bandit), SIM simplify
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["src/api", "src/gateway"]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
